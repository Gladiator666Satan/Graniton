name: Build Custom Telegram Android
on: 
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hard Reset Java Files to Upstream
        run: |
          git checkout TMessagesProj/src/main/java/
          git clean -fd TMessagesProj/src/main/java/

      - name: Customize Branding (Graniton)
        run: |
          # 1. Заміна назви додатка на Graniton
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Graniton<\/string>/g' ./TMessagesProj/src/main/res/values/strings.xml
          
          # 2. Зміна Application ID через gradle.properties (без пошкодження namespace Java-коду)
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=org.graniton.messenger/g' gradle.properties

          # 3. Оптимізація під Galaxy S26 Ultra (тільки arm64-v8a замість 4 платформ: білд ~8-10 хв)
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' ./TMessagesProj_App/build.gradle
          
          # 4. Налаштування Firebase google-services.json для обох модулів (App та Library)
          python3 -c '
          import json, copy
          path = "./TMessagesProj/google-services.json"
          try:
              with open(path) as f:
                  data = json.load(f)
              clients = data.get("client", [])
              pkgs = {c["client_info"]["android_client_info"]["package_name"] for c in clients if "client_info" in c and "android_client_info" in c["client_info"]}
              if "org.graniton.messenger" in pkgs and "org.telegram.messenger" not in pkgs:
                  new_client = copy.deepcopy(clients[0])
                  new_client["client_info"]["android_client_info"]["package_name"] = "org.telegram.messenger"
                  clients.append(new_client)
                  data["client"] = clients
                  with open(path, "w") as f:
                      json.dump(data, f, indent=2)
                  print("Added org.telegram.messenger fallback to google-services.json")
          except Exception as e:
              print("google-services sync error:", e)
          '
          if [ -f "./TMessagesProj/google-services.json" ]; then
            cp ./TMessagesProj/google-services.json ./TMessagesProj_App/google-services.json
            if [ -d "./TMessagesProj_AppHuawei" ]; then
              cp ./TMessagesProj/google-services.json ./TMessagesProj_AppHuawei/google-services.json
            fi
          fi

          # 5. Заміна іконки додатка
          if [ -f "logo.png" ]; then
            cp logo.png ./TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp logo.png ./TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Mod - Dark Purple Energy Theme
        run: |
          # Впровадження палітри Dark Purple у Theme.java
          find . -name "Theme.java" -type f -exec sed -i 's/0xff1c242c/0xff0d0214/g' {} +
          find . -name "Theme.java" -type f -exec sed -i 's/0xff0f171e/0xff08000c/g' {} +
          find . -name "Theme.java" -type f -exec sed -i 's/0xff212d3b/0xff1a0b2e/g' {} +
          find . -name "Theme.java" -type f -exec sed -i 's/0xff5288c1/0xff8a2be2/g' {} +

      - name: Mod - Privacy & Secret Media Saving
        run: |
          # 1. Відключення звіту про прочитання
          sed -i 's/MessagesController.getInstance(currentAccount).markMentionsAsRead/ \/\/ markMentionsAsRead/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          
          # 2. Безпечне зняття заборони на збереження зникаючих медіа в MessageObject
          sed -i 's/mediaTtl > 0/mediaTtl == -1/g' ./TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          sed -i 's/public boolean isSecretMedia() {/public boolean isSecretMedia() { return false; } public boolean _unused_isSecretMedia() {/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          sed -i 's/public static boolean isSecretMedia(TLRPC.Message message) {/public static boolean isSecretMedia(TLRPC.Message message) { return false; } public static boolean _unused_static_isSecretMedia(TLRPC.Message message) {/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          
          # 3. Безпечне вимкнення FLAG_SECURE
          find . -name "*.java" -type f -exec sed -i 's/WindowManager\.LayoutParams\.FLAG_SECURE/0/g' {} +

      - name: Mod - Interface Clean & Media Boost
        run: |
          # 1. Максимальна якість камери та менше стиснення
          sed -i 's/int selectedCompression = 1;/int selectedCompression = 0;/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MediaController.java

      - name: Optimize Runner Memory
        run: |
          # Адаптація виділення памʼяті JVM під GitHub Actions runner
          sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject API Keys
        env:
          INPUT_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID || secrets.api_id }}
          INPUT_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH || secrets.api_hash }}
        run: |
          if [ -n "$INPUT_API_ID" ]; then
            echo "Injecting custom APP_ID..."
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $INPUT_API_ID;/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi
          if [ -n "$INPUT_API_HASH" ]; then
            echo "Injecting custom APP_HASH..."
            sed -i "s/public static String APP_HASH = \"[^\"]*\";/public static String APP_HASH = \"$INPUT_API_HASH\";/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graniton-release-apk
          path: "**/*.apk"
