name: Build Custom Telegram Android
on: 
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hard Reset Java Files to Upstream
        run: |
          git checkout TMessagesProj/src/main/java/
          git clean -fd TMessagesProj/src/main/java/

      - name: Customize Branding (Graniton)
        run: |
          # 1. Заміна назви додатка на Graniton в усіх локалізаціях
          find ./TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Graniton<\/string>/g' {} +
          
          # 2. Зміна Application ID через gradle.properties (без пошкодження namespace Java-коду)
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=org.graniton.messenger/g' gradle.properties

          # 3. Оптимізація під Galaxy S26 Ultra (тільки arm64-v8a: білд ~8-10 хв)
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' ./TMessagesProj_App/build.gradle
          
          # 4. Копіювання Firebase google-services.json для модуля TMessagesProj_App
          if [ -f "./TMessagesProj/google-services.json" ]; then
            cp ./TMessagesProj/google-services.json ./TMessagesProj_App/google-services.json
            if [ -d "./TMessagesProj_AppHuawei" ]; then
              cp ./TMessagesProj/google-services.json ./TMessagesProj_AppHuawei/google-services.json
            fi
          fi

          # 5. Повноцінна заміна адаптивних та звичайних іконок для One UI (Galaxy S26 Ultra)
          pip3 install --break-system-packages pillow || sudo apt-get install -y python3-pil || true
          python3 generate_icons.py

          # 6. Заміна логотипу в шапці головного екрана на текст "Graniton"
          sed -i 's/ssb\.setSpan(new ImageSpan(logoDrawable)/ \/\/ ssb.setSpan(new ImageSpan(logoDrawable)/g' ./TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java
          sed -i 's/getString(R\.string\.AppName)/"Graniton"/g' ./TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="1dp" android:height="1dp" android:viewportWidth="1" android:viewportHeight="1"></vector>' > ./TMessagesProj/src/main/res/drawable/telegram_logo_2.xml

      - name: Mod - Dark Purple Energy Theme
        run: |
          # Впровадження повноцінної Dark Purple Energy палітри в код і тему
          python3 apply_dark_purple_theme.py

      - name: Mod - Privacy & Secret Media Saving
        run: |
          # 1. Відключення звіту про прочитання
          sed -i 's/MessagesController.getInstance(currentAccount).markMentionsAsRead/ \/\/ markMentionsAsRead/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          
          # 2. Безпечне зняття заборони на збереження зникаючих медіа в MessageObject
          sed -i 's/mediaTtl > 0/mediaTtl == -1/g' ./TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          sed -i 's/public boolean isSecretMedia() {/public boolean isSecretMedia() { return false; } public boolean _unused_isSecretMedia() {/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          sed -i 's/public static boolean isSecretMedia(TLRPC.Message message) {/public static boolean isSecretMedia(TLRPC.Message message) { return false; } public static boolean _unused_static_isSecretMedia(TLRPC.Message message) {/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          
          # 3. Безпечне вимкнення FLAG_SECURE
          find . -name "*.java" -type f -exec sed -i 's/WindowManager\.LayoutParams\\.FLAG_SECURE/0/g' {} +

      - name: Mod - Interface Clean & Media Boost
        run: |
          # 1. Максимальна якість камери та менше стиснення
          sed -i 's/int selectedCompression = 1;/int selectedCompression = 0;/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MediaController.java

      - name: Optimize Runner Memory
        run: |
          # Адаптація виділення памʼяті JVM під GitHub Actions runner
          sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Keystore
        run: |
          # Відновлення постійного чистого RSA-ключа Graniton для повної сумісності оновлень
          base64 -d ./TMessagesProj/config/release.keystore.b64 > ./TMessagesProj/config/release.keystore
          sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=granitonpass/g' gradle.properties
          sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=graniton/g' gradle.properties
          sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=granitonpass/g' gradle.properties

      - name: Inject API Keys
        env:
          INPUT_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID || secrets.api_id }}
          INPUT_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH || secrets.api_hash }}
        run: |
          if [ -n "$INPUT_API_ID" ]; then
            echo "Injecting custom APP_ID..."
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $INPUT_API_ID;/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi
          if [ -n "$INPUT_API_HASH" ]; then
            echo "Injecting custom APP_HASH..."
            sed -i "s/public static String APP_HASH = \"[^\"]*\";/public static String APP_HASH = \"$INPUT_API_HASH\";/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          find TMessagesProj_App/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-output/Graniton-arm64-v8a.apk \;
          echo "Found APK:"
          ls -lh release-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graniton-release-apk
          path: "release-output/*.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: "v13.1.1-b${{ github.run_number }}"
          name: "Graniton v13.1.1 (Build ${{ github.run_number }})"
          body: |
            ### 🔮 Graniton Release v13.1.1 (Build ${{ github.run_number }})
            
            **Custom Telegram client for Samsung Galaxy S26 Ultra**
            
            #### 🚀 Що нового та впроваджено:
            - 🏷️ **Шапка чатів Graniton**: напис у шапці головного екрана змінено на "Graniton" замість логотипу Telegram.
            - 🎨 **Брендинг Graniton**: унікальний `org.graniton.messenger` (встановлюється паралельно з офіційним Telegram).
            - 🔮 **Dark Purple Energy Theme**: повноцінна кастомна тема з палітрою `#0d0214` та неоновими акцентами `#8a2be2` за замовчуванням.
            - 📱 **One UI Adaptive Icon**: кастомна іконка під Samsung One UI з глибоким фіолетовим бекграундом `#0d0214`.
            - 📸 **Galaxy S26 Ultra Media Boost**: вимкнено надмірне стиснення фото/відео при зйомці, білд виключно під `arm64-v8a`.
            - 🛡️ **Privacy & Ghost Controls**:
              - Знято блокування скриншотів (`FLAG_SECURE = 0`).
              - Збереження зникаючих фото/відео з таймером у галерею.
              - Вимкнено звіти про прочитання повідомлень.
            - 🔑 **Постійний підпис**: зафіксовано постійний RSA 2048-бітний Keystore для безпроблемного оновлення поверх наявної версії.
            
            #### 📥 Встановлення:
            1. Завантажте `Graniton-arm64-v8a.apk` нижче.
            2. Відкрийте та встановіть (при запиті Play Protect натисніть *«Детальніше» ➔ «Все одно встановити»*).
          files: release-output/Graniton-arm64-v8a.apk
