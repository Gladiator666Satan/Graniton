name: Build Custom Telegram Android
on: 
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/power-pack

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hard Reset Java Files to Upstream
        run: |
          git checkout TMessagesProj/src/main/java/
          git clean -fd TMessagesProj/src/main/java/

      - name: Customize Branding (Graniton)
        run: |
          # 1. Заміна назви додатка, заголовків сповіщень, папок галереї та системних імен на Graniton
          python3 customize_branding.py
          
          # 2. Зміна Application ID через gradle.properties (без пошкодження namespace Java-коду)
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=org.graniton.messenger/g' gradle.properties

          # 3. Оптимізація під Galaxy S26 Ultra (тільки arm64-v8a: білд ~8-10 хв)
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' ./TMessagesProj_App/build.gradle
          python3 -c "with open('./TMessagesProj/build.gradle', 'r') as f: c = f.read(); c = c.replace('defaultConfig {', 'defaultConfig {\n        ndk {\n            abiFilters \"arm64-v8a\"\n        }'); open('./TMessagesProj/build.gradle', 'w').write(c)"
          
          # 4. Копіювання Firebase google-services.json для модуля TMessagesProj_App
          if [ -f "./TMessagesProj/google-services.json" ]; then
            cp ./TMessagesProj/google-services.json ./TMessagesProj_App/google-services.json
            if [ -d "./TMessagesProj_AppHuawei" ]; then
              cp ./TMessagesProj/google-services.json ./TMessagesProj_AppHuawei/google-services.json
            fi
          fi

          # 5. Повноцінна генерація адаптивних та звичайних іконок (реальні PNG/WEBP за щільністю) для One UI
          pip3 install --break-system-packages pillow || sudo apt-get install -y python3-pil || true
          python3 generate_icons.py

          # 6. Перевірка наявності векторного логотипу Graniton (telegram_logo_2.xml)
          ls -la ./TMessagesProj/src/main/res/drawable/telegram_logo_2.xml

      - name: Mod - Dark Purple Energy Theme
        run: |
          # Впровадження повноцінної Dark Purple Energy палітри в код і тему
          python3 apply_dark_purple_theme.py

      - name: Mod - Power Pack (Ghost, Stealth Bombs, Anti-Delete, HD 60fps, 120Hz, Chat Translate)
        run: |
          # Всі патчі приватності, збереження/дешифрування бомбочок, HD 1080p та перекладу з перевіркою цілісності
          python3 apply_power_pack.py

      - name: Optimize Runner Memory
        run: |
          # Адаптація виділення памʼяті JVM під GitHub Actions runner
          sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Keystore
        run: |
          # Створення стабільного release keystore із зафіксованими креденшелами
          base64 -d ./TMessagesProj/config/release.keystore.b64 > ./TMessagesProj/config/release.keystore
          sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=granitonpass/g' gradle.properties
          sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=graniton/g' gradle.properties
          sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=granitonpass/g' gradle.properties

      - name: Inject API Keys
        env:
          INPUT_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID || secrets.api_id }}
          INPUT_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH || secrets.api_hash }}
        run: |
          if [ -n "$INPUT_API_ID" ]; then
            echo "Injecting custom APP_ID..."
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $INPUT_API_ID;/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi
          if [ -n "$INPUT_API_HASH" ]; then
            echo "Injecting custom APP_HASH..."
            sed -i "s/public static String APP_HASH = \"[^\"]*\";/public static String APP_HASH = \"$INPUT_API_HASH\";/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          find TMessagesProj_App/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-output/Graniton-arm64-v8a.apk \;
          echo "Found APK:"
          ls -lh release-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graniton-release-apk
          path: "release-output/*.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/power-pack'
        with:
          tag_name: "v13.1.1-powerpack-b${{ github.run_number }}"
          name: "Graniton Power-Pack v13.1.1 (Build ${{ github.run_number }})"
          body: |
            ### 🔮 Graniton Release v13.1.1 (Build ${{ github.run_number }})
            
            **Custom Telegram client for Samsung Galaxy S26 Ultra**
            
            #### 🚀 Повний функціонал Power-Pack (Audited & Verified):
            - 💣 **Stealth-перегляд, збереження та скриншоти «бомбочок» (View-Once / TTL)**:
              - Збережено відображення бейджа таймера (`1` / `5s` / `10s`) на прев'ю в чаті, але вимкнено відправку звіту про відкриття (`sendSecretMessageRead` / `markMessageContentAsRead`) та видалення (`sendSecretMediaDelete`) — відправник бачить медіа як невідкрите, і воно не зникає.
              - Вимкнено `.enc`-шифрування локального кешу для нових бомбочок та додано автоматичне AES-дешифрування (`EncryptedFileInputStream`) + Bitmap-резерв для збереження у галерею як із переглядача `SecretMediaViewer`, так і з контекстного меню чату (включно з Secret Chats).
              - Повністю знято блокування скриншотів та запису екрана (`FLAG_SECURE = 0`).
            - 🎥 **Чесні HD 60fps кружечки (Video Notes)**: запис нативних круглих повідомлень 384×384 @ 60fps зі студійним бітрейтом 2.5 Мбіт/с та зняттям прихованого ліміту 30fps у `MediaController`.
            - 📸 **HD 1080p відео за замовчуванням**: у `PhotoViewer` знято ліміт 720p (`maxCompression = 2`) — відео з Galaxy S26 Ultra за замовчуванням обирають максимальний HD-профіль.
            - 🙈 **Фікс спойлерів на медіа**: гарантована доставка прапорця спойлера (`hasMediaSpoilers`) на сервери MTProto для фото та відео.
            - 🌐 **Безкоштовний переклад чатів та повідомлень + Ad-Free**: розблоковано панель живого перекладу чатів та кнопку перекладу в меню з автоматичним резервним перекладом без Premium, а також заблоковано спонсорську рекламу в каналах.
            - 🕵️ **True Ghost Mode & Anti-Delete**: вимкнено статуси «друкує...» / «записує...», локальне скидання бейджа `@` без звіту серверу, а також захист від видалення повідомлень «для всіх».
            - 🔓 **Bypass Restricted Content**: обхід `noforwards` — збереження медіа, копіювання тексту/коду та пересилання із захищених каналів.
            - 🎨 **Повний брендинг Graniton**:
              - Всі збережені фото, відео та завантаження потрапляють у альбоми `Graniton` (замість `Telegram`).
              - Сповіщення з фіолетовим акцентом `#8b2be2` та підписом `Graniton` на One UI, rebreding діалогів біометрії/коду доступу та сервісних чатів.
              - Оновлений ідеально рівний векторний логотип `GRANITON` у шапці та оптимізовані за щільністю `PNG`/`WEBP` іконки (зменшено розмір APK на ~25 МБ).
            - ⚡ **Force 120Hz Fluidity**: апаратне блокування максимальної частоти оновлення дисплея (120Hz) на Galaxy S26 Ultra (`arm64-v8a`).
            
            #### 📥 Встановлення:
            1. Завантажте `Graniton-arm64-v8a.apk` нижче.
            2. Відкрийте та встановіть поверх наявної версії (постійний RSA Keystore збережено).
          files: release-output/Graniton-arm64-v8a.apk
