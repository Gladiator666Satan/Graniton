name: Build Custom Telegram Android
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Customize Branding (Graniton)
        run: |
          # 1. Замена названия приложения на Graniton
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Graniton<\/string>/g' ./TMessagesProj/src/main/res/values/strings.xml
          
          # 2. Гарантированная замена имени пакета во всех конфигурациях сборки Gradle
          find . -name "*.gradle" -type f -exec sed -i 's/"org.telegram.messenger"/"org.graniton.messenger"/g' {} +
          find . -name "*.gradle" -type f -exec sed -i "s/'org.telegram.messenger'/'org.graniton.messenger'/g" {} +
          
          # 3. Замена иконки приложения
          if [ -f "logo.png" ]; then
            cp logo.png ./TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp logo.png ./TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Mod - Dark Purple Energy Theme
        run: |
          # Внедрение глубокой темно-фиолетовой палитры в файл стандартных тем
          find . -name "Theme.java" -type f -exec sed -i 's/0xff1c242c/0xff0d0214/g' {} +
          find . -name "Theme.java" -type f -exec sed -i 's/0xff0f171e/0xff08000c/g' {} +
          find . -name "Theme.java" -type f -exec sed -i 's/0xff212d3b/0xff1a0b2e/g' {} +
          find . -name "Theme.java" -type f -exec sed -i 's/0xff5288c1/0xff8a2be2/g' {} +

      - name: Mod - Privacy & Secret Media Saving
        run: |
          # 1. Отключение отчета о прочтении (Режим Невидимки)
          sed -i 's/MessagesController.getInstance(currentAccount).markMentionsAsRead/ \/\/ markMentionsAsRead/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          
          # 2. Разрешение на сохранение исчезающих фото/видео в галерею
          sed -i 's/mediaTtl > 0/mediaTtl == -1/g' ./TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          sed -i 's/isSecretMedia()/false/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          
          # 3. Точечное и безопасное отключение FLAG_SECURE (не ломая названия методов и классов)
          find . -name "*.java" -type f -exec sed -i 's/\.FLAG_SECURE/.0/g' {} +

      - name: Mod - Interface Clean & Media Boost
        run: |
          # 1. Блокировка официальной рекламы в каналах
          sed -i 's/view.isAd = true;/view.isAd = false;\nreturn;/g' ./TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatActionCell.java
          
          # 2. Снятие ограничений на копирование и сохранение медиа из защищенных каналов
          sed -i 's/megagroup && !isPublic()/false/g' ./TMessagesProj/src/main/java/org/telegram/messenger/ChatObject.java
          sed -i 's/noforwards/false/g' ./TMessagesProj/src/main/java/org/telegram/messenger/ChatObject.java
          
          # 3. Максимальное качество камеры и меньшее сжатие медиа
          sed -i 's/int selectedCompression = 1;/int selectedCompression = 0;/g' ./TMessagesProj/src/main/java/org/telegram/messenger/MediaController.java

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject API Keys
        run: |
          sed -i 's/YOUR_API_ID/${{ secrets.TELEGRAM_API_ID }}/g' ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/YOUR_API_HASH/${{ secrets.TELEGRAM_API_HASH }}/g' ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-custom-apk
          path: "**/*.apk"
