name: Build Graniton Uncensored Android
on: 
  workflow_dispatch:
  push:
    branches:
      - uncensored

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hard Reset Java Files to Upstream
        run: |
          git checkout TMessagesProj/src/main/java/
          git clean -fd TMessagesProj/src/main/java/

      - name: Customize Branding (Graniton)
        run: |
          # 1. Заміна назви додатка, заголовків сповіщень, папок галереї та системних імен на Graniton
          python3 customize_branding.py
          
          # 2. Зміна Application ID через gradle.properties (сумісне оновлення поверх стандартного Graniton)
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=org.graniton.messenger/g' gradle.properties

          # 3. Оптимізація під Galaxy S26 Ultra (тільки arm64-v8a: білд ~8-10 хв)
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' ./TMessagesProj_App/build.gradle
          python3 -c "with open('./TMessagesProj/build.gradle', 'r') as f: c = f.read(); c = c.replace('defaultConfig {', 'defaultConfig {\n        ndk {\n            abiFilters \"arm64-v8a\"\n        }'); open('./TMessagesProj/build.gradle', 'w').write(c)"
          
          # 4. Копіювання Firebase google-services.json для модуля TMessagesProj_App
          if [ -f "./TMessagesProj/google-services.json" ]; then
            cp ./TMessagesProj/google-services.json ./TMessagesProj_App/google-services.json
            if [ -d "./TMessagesProj_AppHuawei" ]; then
              cp ./TMessagesProj/google-services.json ./TMessagesProj_AppHuawei/google-services.json
            fi
          fi

          # 5. Повноцінна генерація адаптивних та звичайних іконок (реальні PNG/WEBP за щільністю) для One UI
          pip3 install --break-system-packages pillow || sudo apt-get install -y python3-pil || true
          python3 generate_icons.py

          # 6. Перевірка наявності векторного логотипу Graniton (telegram_logo_2.xml)
          ls -la ./TMessagesProj/src/main/res/drawable/telegram_logo_2.xml

      - name: Mod - Dark Purple Energy Theme
        run: |
          # Впровадження повноцінної Dark Purple Energy палітри в код і тему
          python3 apply_dark_purple_theme.py

      - name: Mod - Power Pack (Ghost, Stealth Bombs, Anti-Delete, HD 60fps, 120Hz, Chat Translate)
        run: |
          # Всі патчі приватності, збереження/дешифрування бомбочок, HD 1080p та перекладу з перевіркою цілісності
          python3 apply_power_pack.py

      - name: Mod - Uncensored Edition (Bypass Google Play & Sensitive Restrictions)
        run: |
          # Повне зняття цензури Google Play ("android", "android-all", "all"), 18+ блюру та вікової верифікації
          python3 apply_uncensored.py

      - name: Optimize Runner Memory
        run: |
          # Адаптація виділення памʼяті JVM під GitHub Actions runner
          sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Keystore
        run: |
          # Створення стабільного release keystore із зафіксованими креденшелами
          base64 -d ./TMessagesProj/config/release.keystore.b64 > ./TMessagesProj/config/release.keystore
          sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=granitonpass/g' gradle.properties
          sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=graniton/g' gradle.properties
          sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=granitonpass/g' gradle.properties

      - name: Inject API Keys
        env:
          INPUT_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID || secrets.api_id }}
          INPUT_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH || secrets.api_hash }}
        run: |
          if [ -n "$INPUT_API_ID" ]; then
            echo "Injecting custom APP_ID..."
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $INPUT_API_ID;/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi
          if [ -n "$INPUT_API_HASH" ]; then
            echo "Injecting custom APP_HASH..."
            sed -i "s/public static String APP_HASH = \"[^\"]*\";/public static String APP_HASH = \"$INPUT_API_HASH\";/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          find TMessagesProj_App/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-output/Graniton-Uncensored-arm64-v8a.apk \;
          echo "Found APK:"
          ls -lh release-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graniton-Uncensored-release-apk
          path: "release-output/*.apk"

      - name: Create GitHub Release (Uncensored Edition)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/uncensored'
        with:
          tag_name: "v13.1.1-uncensored-b${{ github.run_number }}"
          name: "Graniton Uncensored v13.1.1 — Full Freedom Edition (Build ${{ github.run_number }})"
          body: |
            ### 🔓 Graniton Uncensored v13.1.1 — Full Freedom Edition (Build ${{ github.run_number }})
            
            **Повністю розблокована версія Graniton БЕЗ цензури Google Play та вікових обмежень (гілка `uncensored`) для Samsung Galaxy S26 Ultra (`arm64-v8a`)**
            
            > 💡 **Дві версії застосунку у репозиторії:**
            > - 🔒 **`master` (`Graniton-arm64-v8a.apk`)** — стандартна версія зі збереженням базових обмежень платформи.
            > - 🔓 **`uncensored` (`Graniton-Uncensored-arm64-v8a.apk`)** — ця збірка: повна свобода перегляду будь-яких каналів, ботів та медіа без блокувань Google Play.
            > Обидві версії підписані єдиним ключем Graniton (`org.graniton.messenger`), тому ви можете вільно встановлювати одну поверх іншої без втрати акаунта чи історії чатів!
            
            ---
            
            #### 🔓 Що розблоковано у версії Uncensored (`apply_uncensored.py`):
            - 🚫 **Знято блокування Google Play Store (`platform: "android"`, `"android-all"`, `"all"`)**: канали, групи, боти, міні-додатки та окремі пости, які раніше видавали помилку *«Цей канал не може бути відображений, оскільки його не можна переглядати в застосунках, завантажених із Google Play»*, тепер відкриваються та відображаються миттєво й без жодних заглушок (`MessagesController.getRestrictionReason`).
            - 🔞 **Вимкнено примусове приховування `18+ / Sensitive Content`**: знято примусовий блюр «Чутливий контент» на фото/відео/GIF у каналах та прибрано діалогові вікна попередження під час входу (`MessagesController.isSensitive`, `MessageObject.isSensitive`), при цьому звичайні авторські спойлери користувачів (`media.spoiler`) працюють штатно.
            - 🪪 **Вимкнено відео-верифікацію віку (`ThemeActivity.verifyAge`)**: обхід нового бота перевірки віку з Telegram v13.1+.
            - 📡 **Direct / Non-Store MTProto режим (`ConnectionsManager.init`)**: клієнт ніколи не передає ідентифікатор магазину Google Play (`com.android.vending`) на сервери MTProto, зберігаючи повну сумісність із Play Integrity та Firebase Push.
            
            ---
            
            #### 🚀 Усі можливості Graniton Power-Pack також включено:
            - 💣 **Stealth Bombs & View-Once**: збереження зникаючих фото/відео в галерею (з прозорим розшифруванням `.enc`), збереження бейджа таймера, перегляд без звіту відправнику та розблоковані скриншоти (`FLAG_SECURE` знято).
            - 🎥 **HD 60fps Video Notes (`2.5 Мбіт/с`)** + **HD 1080p відео за замовчуванням** + **робочі медіа-спойлери**.
            - 🕵️ **True Ghost Mode**, 🛡️ **Anti-Delete Protection**, 🔓 **Bypass `noforwards`**, 🌐 **Живий переклад чатів без Premium**, 🚫 **Ad-Free**.
            - ⚡ **Force 120Hz + Dark Purple Energy Theme (`#0d0214` / `#8b2be2`) + брендування One UI**.
            
            ---
            
            #### 📥 Встановлення / Перехід зі звичайної версії:
            1. Завантажте **`Graniton-Uncensored-arm64-v8a.apk`** нижче.
            2. Встановіть прямо поверх наявного Graniton — сесія, чати та налаштування збережуться автоматично.
          files: release-output/Graniton-Uncensored-arm64-v8a.apk
