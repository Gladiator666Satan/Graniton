name: Build Custom Telegram Android
on: 
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hard Reset Java Files to Upstream
        run: |
          git checkout TMessagesProj/src/main/java/
          git clean -fd TMessagesProj/src/main/java/

      - name: Customize Branding (Graniton)
        run: |
          # 1. Заміна назви додатка, заголовків сповіщень, папок галереї та системних імен на Graniton
          python3 customize_branding.py
          
          # 2. Зміна Application ID через gradle.properties (без пошкодження namespace Java-коду)
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=org.graniton.messenger/g' gradle.properties

          # 3. Оптимізація під Galaxy S26 Ultra (тільки arm64-v8a: білд ~8-10 хв)
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' ./TMessagesProj_App/build.gradle
          python3 -c "with open('./TMessagesProj/build.gradle', 'r') as f: c = f.read(); c = c.replace('defaultConfig {', 'defaultConfig {\n        ndk {\n            abiFilters \"arm64-v8a\"\n        }'); open('./TMessagesProj/build.gradle', 'w').write(c)"
          
          # 4. Копіювання Firebase google-services.json для модуля TMessagesProj_App
          if [ -f "./TMessagesProj/google-services.json" ]; then
            cp ./TMessagesProj/google-services.json ./TMessagesProj_App/google-services.json
            if [ -d "./TMessagesProj_AppHuawei" ]; then
              cp ./TMessagesProj/google-services.json ./TMessagesProj_AppHuawei/google-services.json
            fi
          fi

          # 5. Повноцінна генерація адаптивних та звичайних іконок (реальні PNG/WEBP за щільністю) для One UI
          pip3 install --break-system-packages pillow || sudo apt-get install -y python3-pil || true
          python3 generate_icons.py

          # 6. Перевірка наявності векторного логотипу Graniton (telegram_logo_2.xml)
          ls -la ./TMessagesProj/src/main/res/drawable/telegram_logo_2.xml

      - name: Mod - Dark Purple Energy Theme
        run: |
          # Впровадження повноцінної Dark Purple Energy палітри в код і тему
          python3 apply_dark_purple_theme.py

      - name: Mod - Power Pack (Ghost, Stealth Bombs, Anti-Delete, HD 60fps, 120Hz, Chat Translate)
        run: |
          # Всі патчі приватності, збереження/дешифрування бомбочок, HD 1080p та перекладу з перевіркою цілісності
          python3 apply_power_pack.py

      - name: Optimize Runner Memory
        run: |
          # Адаптація виділення памʼяті JVM під GitHub Actions runner
          sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Keystore
        run: |
          # Створення стабільного release keystore із зафіксованими креденшелами
          base64 -d ./TMessagesProj/config/release.keystore.b64 > ./TMessagesProj/config/release.keystore
          sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=granitonpass/g' gradle.properties
          sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=graniton/g' gradle.properties
          sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=granitonpass/g' gradle.properties

      - name: Inject API Keys
        env:
          INPUT_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID || secrets.api_id }}
          INPUT_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH || secrets.api_hash }}
        run: |
          if [ -n "$INPUT_API_ID" ]; then
            echo "Injecting custom APP_ID..."
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $INPUT_API_ID;/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi
          if [ -n "$INPUT_API_HASH" ]; then
            echo "Injecting custom APP_HASH..."
            sed -i "s/public static String APP_HASH = \"[^\"]*\";/public static String APP_HASH = \"$INPUT_API_HASH\";/g" ./TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          find TMessagesProj_App/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-output/Graniton-arm64-v8a.apk \;
          echo "Found APK:"
          ls -lh release-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graniton-release-apk
          path: "release-output/*.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: "v13.1.1-graniton-b${{ github.run_number }}"
          name: "Graniton v13.1.1 — Stable Power-Pack (Build ${{ github.run_number }})"
          body: |
            ### 🔮 Graniton v13.1.1 — Stable Release (Build ${{ github.run_number }})
            
            **Флагманська стабільна збірка Graniton (основна гілка `master`) для Samsung Galaxy S26 Ultra (`arm64-v8a`)**
            
            ---
            
            #### 🔧 Виправлення та аудит у цьому релізі (Fixes & Improvements):
            - 🛠️ **Виправлено `SecretMediaViewer` та збереження зникаючих медіа**: усунено помилку інжекції методу збереження, додано кнопку збереження в галерею без накладання на таймер та вимкнено примусове автовидалення при закритті.
            - 🔓 **Автоматичне AES-дешифрування `.enc` для «бомбочок»**: вимкнено локальне `.enc`-шифрування для нових зникаючих фото/відео, а для вже кешованих реалізовано прозоре розшифрування (`EncryptedFileInputStream`) + резервне збереження `Bitmap` із пам'яті. Розблоковано збереження через контекстне меню в усіх чатах (включно з Secret Chats).
            - ⏱️ **Відновлено індикатор таймера + Stealth-перегляд**: повернуто відображення бейджа таймера (`1`, `5s`, `10s`) на розмитому прев'ю в чаті, але заблоковано відправку звітів про відкриття (`sendSecretMessageRead`, `markMessageContentAsRead`) та команду видалення (`sendSecretMediaDelete`) — у відправника «бомбочки», одноразові голосові та кружечки залишаються невідкритими.
            - 🎥 **Виправлено прихований даунгрейд 60fps ➔ 30fps для кружечків**: вимкнено внутрішнє обмеження 30 кадрів/с у `MediaController` для круглих відеоповідомлень `384×384` (тепер чесні `60fps` @ `2.5 Мбіт/с` у нативному круглому форматі).
            - 📸 **Виправлено якість відео за замовчуванням (HD 1080p)**: у `PhotoViewer.selectCompression()` знято ліміт 720p (`maxCompression = 2`) — відео за замовчуванням відправляються в максимальному HD-профілі.
            - 🙈 **Виправлено медіа-спойлери (`hasMediaSpoilers`)**: гарантована доставка прапорця спойлера на сервери MTProto для одиночних та групових фото й відео (отримувач бачить медіа розмитим).
            - 🌐 **Розблоковано живий переклад чатів та повідомлень**: активовано `TranslateController` (верхня панель перекладу чату + кнопка в меню) із безкоштовним клієнтським фолбеком без Premium.
            - 🔔 **Виправлено брендування сповіщень, біометрії та папок Галереї**:
              - Усунено появу підпису «Telegram» у спливаючих сповіщеннях One UI (`android.substName`), встановлено неоново-фіолетовий акцент `#8b2be2`.
              - Перекладено всі згадки в діалогах відбитка пальця та коду доступу (`LocaleController`), а також у системних чатах (`Graniton Notifications`, `Graniton Support`).
              - Усі збережені фото, відео та файли тепер зберігаються в системні альбоми **`Graniton`** замість `Telegram`.
            - 🏷️ **Оновлено логотип `GRANITON` та іконки APK**: усунено накладання літер у векторному логотипі шапки (`telegram_logo_2.xml`, `evenOdd`), а іконки згенеровано у нативних форматах `PNG`/`WEBP` під кожну щільність екрана (розмір APK зменшено на ~25–30 МБ).
            
            ---
            
            #### 🚀 Основні можливості Graniton Power-Pack:
            - 🕵️ **True Ghost Mode**: приховано статуси *«друкує...»* / *«записує голосове...»* та локальне очищення бейджа `@` без звіту на сервер.
            - 🛡️ **Anti-Delete Protection**: повідомлення залишаються у вашій історії навіть після видалення «для всіх».
            - 🔓 **Bypass `noforwards` & Global Screenshot Unblock**: збереження, копіювання, пересилання із закритих каналів та повне зняття `FLAG_SECURE` у всьому застосунку.
            - 🚫 **Ad-Free**: повністю заблоковано рекламні спонсорські повідомлення в каналах.
            - ⚡ **Force 120Hz + ARM64-v8a**: максимальна плавність інтерфейсу на Galaxy S26 Ultra та паралельне встановлення (`org.graniton.messenger`).
            - 🔮 **Dark Purple Energy Theme**: фірмова темна фіолетова палітра `#0d0214` / `#8b2be2` за замовчуванням.
            
            ---
            
            #### 📥 Встановлення / Оновлення:
            1. Завантажте **`Graniton-arm64-v8a.apk`** нижче.
            2. Встановіть поверх наявної версії (постійний RSA Keystore збережено, дані та чати залишаються на місці). При запиті Play Protect натисніть *«Детальніше» ➔ «Все одно встановити»*.
          files: release-output/Graniton-arm64-v8a.apk
